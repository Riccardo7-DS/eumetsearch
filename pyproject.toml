[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eumetsearch"
version = "0.1.3"
description = "Package to download MTG FCI / MSG SEVIRI data and export to regular-grid or MajorTOM sparse Zarr"
authors = [
  { name = "Riccardo D’Ercole" }
]
readme = "README.md"
requires-python =">=3.11"

dependencies = [
    "xarray>=2025.7.1,<2026.0.0",
    "eumdac>=3.0.0,<4.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "tqdm>=4.67.1",
    "netcdf4>=1.7.2",
    "dask>=2025.7.0",
    "matplotlib>=3.10.3",
    "pyresample>=1.34.2",
    "pydantic>=2.11.7",
    "satpy>=0.57.0",
    "zarr>=2.18.7",
    "ipykernel>=6.30.0",
    "h5netcdf>=1.6.3",
    "pyproj (>=3.7.2,<4.0.0)",
    "s3fs>=2025.9.0",
    "geopandas>=1.1.1",
    "rioxarray>=0.19.0",
    "filelock>=3.20.0",
    "huggingface-hub>=0.24.0",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
# Lightweight install for analysis / alignment only (no download deps).
# Install with: pip install -e ".[transform]"
transform = [
    "numpy>=1.24",
    "zarr>=2.18",
    "xarray>=2024.0",
    "dask>=2024.0",
    "pyproj>=3.6",
    "scipy>=1.11",
    "pydantic>=2.0",
    "pandas>=2.0",
    "tqdm>=4.0",
    "matplotlib>=3.7",
    "geopandas>=1.0",
    "rioxarray>=0.15",
]

# Optional Google Earth Engine land-fraction tile filtering
# (used by data_collection/pipeline_data.py when --min_land_fraction > 0).
gee = [
    "earthengine-api>=1.7.26",
]

# The optional ESA PhiLab MajorTOM package (grid definitions) is not published
# on PyPI, so it can't be declared as a normal or extras dependency here.
# Install it manually if needed:
#   pip install "majortom @ git+https://github.com/ESA-PhiLab/Major-TOM.git"
# If not installed, the grid is downloaded from HuggingFace Hub automatically.

[dependency-groups]
dev = [
    "py-spy>=0.4.1",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eumetsearch"]

